<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Escalas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #005f73;
            --text-color: #e0f2f1;
            --primary-color: #0a9396;
            --secondary-color: #94d2bd;
            --table-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #003e4b 100%);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }
        h1, h2, h3 { color: #fff; text-align: center; }
        .date-picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        input[type="date"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1em;
        }
        .table-section { margin-bottom: 30px; }
        .table-title {
            background-color: var(--primary-color);
            color: #fff;
            padding: 10px;
            margin: 0;
            border-radius: 8px 8px 0 0;
            font-size: 1.1em;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--table-bg);
            border: 1px solid var(--border-color);
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: 500;
            color: var(--secondary-color);
            text-transform: uppercase;
            font-size: 0.9em;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: var(--hover-color); }
        .footer { text-align: center; margin-top: 50px; font-size: 0.8em; opacity: 0.6; }
        .loading, .no-data { text-align: center; padding: 30px; font-style: italic; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestão de Escalas</h1>
        
        <div class="date-picker-container">
            <label for="web-date-picker">Selecione a Data:</label>
            <input type="date" id="web-date-picker" value="2026-03-21">
        </div>

        <h2 id="subtitle">Escala do Dia</h2>

        <div id="content-area">
            <div class="loading">Carregando dados da nuvem...</div>
        </div>

        <div class="footer">Gerado automaticamente pelo sistema Desktop. Sincronizado com a nuvem.</div>
    </div>

    <script>
        const REPO_URL = "https://raw.githubusercontent.com/WorkstationNeural/GestaoEscalasDesktop/main/settings.json";
        const MAIN_TABLES = ['N1', 'N2', 'GA'];
        let cachedDailyScales = {};

        async function fetchSettings() {
            try {
                // Adiciona um random query para evitar cache severo do raw.githubusercontent
                const res = await fetch(REPO_URL + "?t=" + new Date().getTime());
                if (!res.ok) throw new Error("Erro na rede");
                const json = await res.json();
                if (json.daily_scales) {
                    cachedDailyScales = json.daily_scales;
                    renderData(document.getElementById('web-date-picker').value);
                } else {
                    throw new Error("Formato inválido");
                }
            } catch (err) {
                console.error(err);
                document.getElementById('content-area').innerHTML = '<div class="no-data">Falha ao buscar escalas do servidor. Tente novamente mais tarde.</div>';
            }
        }

        function formatBR(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts[2] + '/' + parts[1] + '/' + parts[0];
        }

        function renderData(dateStr) {
            document.getElementById('subtitle').textContent = "Escala do dia " + formatBR(dateStr);
            const contentArea = document.getElementById('content-area');
            
            const data = cachedDailyScales[dateStr];
            if (!data) {
                contentArea.innerHTML = '<div class="no-data">Nenhuma escala cadastrada para esta data.</div>';
                return;
            }

            let tablesHtml = '';
            let hasContent = false;

            MAIN_TABLES.forEach(tableId => {
                const rows = data[tableId] || [];
                if (rows.length === 0) return;

                hasContent = true;
                let rowsHtml = '';
                rows.forEach(r => {
                    rowsHtml += '<tr>';
                    rowsHtml += '<td>' + (r.time || '-') + '</td>';
                    rowsHtml += '<td>' + (r.name || '-') + '</td>';
                    rowsHtml += '<td>' + (r.date || '-') + '</td>';
                    rowsHtml += '<td>' + (r.mode || '-') + '</td>';
                    rowsHtml += '<td>' + (r.site || '-') + '</td>';
                    rowsHtml += '</tr>';
                });

                tablesHtml += '<div class="table-section">';
                tablesHtml += '<h2 class="table-title">' + tableId + '</h2>';
                tablesHtml += '<table><thead><tr>';
                tablesHtml += '<th>Horário</th><th>Nome</th><th>Data</th><th>Modalidade</th><th>Site</th>';
                tablesHtml += '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
            });

            if (!hasContent) {
                contentArea.innerHTML = '<div class="no-data">Escala vazia para esta data.</div>';
            } else {
                contentArea.innerHTML = tablesHtml;
            }
        }

        document.getElementById('web-date-picker').addEventListener('change', (e) => {
            renderData(e.target.value);
        });

        // Iniciar
        fetchSettings();
    </script>
</body>
</html>
